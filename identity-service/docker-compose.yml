version: '3.8'

services:
  db_postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: angelescuela
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  db_mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  identity-service:
    build: ./identity-service
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./identity-service:/app
    ports:
      - "8001:8001"
    depends_on:
      - db_postgres
    environment:
      - POSTGRES_DB=identity_db
      - POSTGRES_USER=angelescuela
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db_postgres
      - POSTGRES_PORT=5432

  business-service:
    build: ./business-service
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./business-service:/app
    ports:
      - "8000:8000"
    depends_on:
      - db_postgres
      - db_mongo
    environment:
      - POSTGRES_DB=flotillas_db
      - POSTGRES_USER=angelescuela
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db_postgres
      - POSTGRES_PORT=5432
      - MONGO_URI=mongodb://db_mongo:27017/
      - MONGO_DB_NAME=flotillas_mongo_db

volumes:
  postgres_data:
  mongo_data: